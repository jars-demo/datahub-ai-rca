# Ingest the workshop's Langfuse project: prompt versions, traces, generations and scores.
# Uses the Langfuse source from datahub-project/datahub#19923, bundled in rca_ingestion/.
# Run: python -m rca_ingestion.run langfuse
source:
  type: rca_ingestion.langfuse_source.langfuse.LangfuseSource
  config:
    connection:
      host: ${LANGFUSE_HOST}
      public_key: ${LANGFUSE_PUBLIC_KEY}
      secret_key: ${LANGFUSE_SECRET_KEY}
    window:
      start_time: "-8 days"

sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL}
    token: ${DATAHUB_TOKEN}
